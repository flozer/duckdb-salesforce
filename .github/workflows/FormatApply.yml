# TEMPORARY, apply-only workflow for PM->DEV #006 Task 1 (conclusion of
# R-004). Not part of the normal suite; delete once src/ is confirmed
# formatted (this file removes itself as its last step).
#
# Runs clang-format -i over src/ using the pinned version DuckDB's own
# tooling uses (11.0.1, see duckdb/scripts/format.py) against the
# .clang-format already in the repo root (added in cycle #004, copied
# verbatim from duckdb/.clang-format), then commits the result back to this
# branch and re-runs --dry-run to prove zero diffs remain. No local build
# involved -- formatting only, no compilation.

name: R-004 Apply clang-format (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - chore/pm006-format-appendix-community

permissions:
  contents: write

jobs:
  apply-format:
    name: Apply clang-format to src/ and commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-format 11.0.1 (matches duckdb/scripts/format.py pin)
        run: |
          sudo pip3 install 'clang_format==11.0.1'
          clang-format --version

      - name: clang-format --dry-run BEFORE (baseline count)
        run: |
          total=0
          dirty=0
          for f in $(find src -name '*.cpp' -o -name '*.hpp'); do
            total=$((total + 1))
            if ! clang-format --dry-run --Werror "$f" > /dev/null 2>&1; then
              dirty=$((dirty + 1))
            fi
          done
          echo "BEFORE: $dirty / $total files in src/ would change"

      - name: Apply clang-format -i to src/
        run: |
          find src -name '*.cpp' -o -name '*.hpp' | xargs clang-format -i

      - name: clang-format --dry-run AFTER (must be zero)
        run: |
          total=0
          dirty=0
          for f in $(find src -name '*.cpp' -o -name '*.hpp'); do
            total=$((total + 1))
            if ! clang-format --dry-run --Werror "$f" > /dev/null 2>&1; then
              dirty=$((dirty + 1))
              echo "STILL DIRTY: $f"
            fi
          done
          echo "AFTER: $dirty / $total files in src/ would change"
          if [ "$dirty" -ne 0 ]; then
            echo "::error::clang-format left $dirty file(s) unformatted"
            exit 1
          fi

      - name: Commit formatted src/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src; then
            echo "No formatting changes needed."
            exit 0
          fi
          git add src
          git commit -m "style: apply clang-format to src/ (R-004, cycle #006)" -m "Reformats all of src/ with the .clang-format added in cycle #004 (clang-format 11.0.1, matching duckdb/scripts/format.py's pin). No behavior change -- formatting only."
          git push
